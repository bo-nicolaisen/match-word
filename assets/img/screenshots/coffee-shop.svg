  <rect y="2000" width="1280" height="200" fill="#2b1d14"/>
  <text x="80" y="2100" font-family="Arial, sans-serif" font-size="16" fill="#c8a27c">© 2026 Bean &amp; Brew · Privacy · Terms · Instagram</text>
